# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Expense Release Readiness, Reset, and Operational Trust"
  slug: "expense-release-readiness-reset-operational-trust"
  kind: existing_plan
  tranche: "Validate the Goal 3 handoff, then complete successive safe release-readiness work packages until Expense System V1 is operationally ready for owner-managed deployment."
  status: done
  oracle:
    signal: "Expense System V1 is release-ready when reset/export handling, route/navigation compatibility, Kamal/build/PWA operational notes, sync-failure observability, production-like offline/manual acceptance evidence or owner instructions, and final acceptance across Goals 1 and 2 are complete and verified without performing production deployment."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts and passing verification cover Goal 1/2 prerequisite checks, old data reset/export decision, old expense route/navigation compatibility, deploy-readiness documentation for Kamal and asset compilation, PWA/service worker operational notes, sync-failure observability, production-like offline/manual acceptance evidence or operator instructions, and final release acceptance."
  intake:
    original_request: "Prepare GoalBuddy for documentation/expense_goal_3_release_readiness_reset_operational_trust_2026-06-10.md."
    interpreted_outcome: "Use the existing Goal 3 plan to prepare and execute release-readiness work for the completed expense system without performing production deployment."
    input_shape: existing_plan
    audience: "PlanGoReminisce product owner/operator, future maintainers, and the implementation team preparing the release."
    authority: requested
    proof_type: test
    completion_proof: "The product owner/operator has a verified release-readiness package: automated tests pass, production-like PWA/offline behavior is validated or instructions are documented, old test data reset/export handling is decided and documented, old routes/navigation are safe, Kamal/build/service worker implications are documented, sync failures are observable, and final acceptance maps back to Goals 1 and 2."
    likely_misfire: "Treating Goal 3 as a documentation-only pass while skipping old-route cleanup, production-like PWA/offline proof, sync failure observability, reset/export decision logging, or final acceptance mapped back to Goals 1 and 2."
    blind_spots_considered:
      - "Actual production deployment is explicitly out of scope."
      - "Destructive production data reset must not be performed by this goal."
      - "The implementation team may be unable to perform the full manual acceptance walkthrough; owner-facing instructions are acceptable when local/staging constraints block direct walkthrough."
      - "Docker/Kamal asset compilation must account for the new TypeScript bundle from Goal 2."
      - "Service worker cache versioning and PWA behavior need production-like smoke proof to avoid stale asset confusion."
      - "Release acceptance must not assume Goals 1 and 2 are complete without checking their receipts and current verification."
    existing_plan_facts:
      - "Primary plan: documentation/expense_goal_3_release_readiness_reset_operational_trust_2026-06-10.md."
      - "Goal 3 depends on Goal 1 backend/domain/API and Goal 2 frontend/offline/PWA completion."
      - "Kamal remains the deployment target."
      - "No separate frontend host, API service, native app build, external sync service, or external AI service is required for V1."
      - "Existing production expense data is test data; careful production migration is not required."
      - "Old expense routes must redirect to the new app or be safely removed."
      - "The release decision and reset/export handling must be recorded in documentation/decision_log.md."
      - "Testing must continue documentation/testing.md and documentation/delivery_standards.md."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/expense-release-readiness-reset-operational-trust"

active_task: null

