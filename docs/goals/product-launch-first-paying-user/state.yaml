      - "The package would overwrite or invalidate unexplained pre-existing user changes."
      - "A material product, legal, pricing, spending, credential, or production decision lacks owner approval."
      - "Verification fails twice without a new evidence-based diagnosis."
    receipt:
      result: done
      summary: "Recovered the mixed Expense V1 tree without discarding owner work; repaired current calendar and panel-based browser expectations, fixed copy/sidebar/mobile-navigation defects, and isolated Playwright test data. Rails is green before and after all 16 Expense browser scenarios."
      evidence:
        - notes/T006-expense-v1-recovery.md
      note: notes/T006-expense-v1-recovery.md
      harness: codex
