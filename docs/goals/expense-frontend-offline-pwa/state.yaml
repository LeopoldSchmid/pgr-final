# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Expense Frontend Offline PWA"
  slug: "expense-frontend-offline-pwa"
  kind: existing_plan
  tranche: "Build successive safe verified frontend/offline/PWA slices until the full Goal 2 expense experience is complete."
  status: done
  oracle:
    signal: "The new expense UI replaces the old expense flow and passes browser-facing proof for quick add, unequal splits, pending person inclusion, offline create/edit/void, refresh/restart persistence, reconnect sync, duplicate retry protection, conflict state handling, PWA shell caching, and mobile usability."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts and passing verification cover parser behavior, split editor state, IndexedDB/offline queue behavior, sync transitions, conflict handling, PWA shell caching, online quick add, unequal splits, pending person inclusion, offline create/edit/void, reconnect sync, duplicate retry protection, and legacy flow replacement."
  intake:
    original_request: "Prepare GoalBuddy for documentation/expense_goal_2_frontend_offline_pwa_2026-06-10.md; no UI board needed."
    interpreted_outcome: "Use the existing Goal 2 plan to execute the modern expense frontend and offline PWA experience against the Goal 1 backend."
    input_shape: existing_plan
    audience: "PlanGoReminisce travelers and the development team implementing Goal 2."
    authority: requested
    proof_type: test
    completion_proof: "The new expense app is implemented, replaces the old clunky flow, works offline after prior online use, preserves queued changes across refresh/restart, syncs without duplication, shows conflicts clearly, and passes the required browser-facing tests."
    likely_misfire: "Delivering a modern-looking UI or partial quick-add surface while leaving durable offline editing, conflict states, duplicate-safe sync, API integration, mobile friction, or fixed low-dependency technology choices incomplete."
    blind_spots_considered:
      - "Service workers and IndexedDB work in a normal browser tab after prior online use; PWA installation is only launch convenience."
      - "Offline editing and voiding previously synced expenses require base revision tracking and visible conflict handling."
      - "Goal 1 API contracts must be validated before frontend slices depend on them."
      - "Browser/PWA/offline tests may need both Rails system tests and standalone Playwright specs."
      - "Production deployment is intentionally excluded from Goal 2."
      - "The UI must be mobile-first and low-friction without becoming a full SPA rewrite."
    existing_plan_facts:
      - "Primary plan: documentation/expense_goal_2_frontend_offline_pwa_2026-06-10.md."
      - "Goal 2 depends on Goal 1 backend/API, canonical split behavior, idempotency, revisions, and conflict semantics."
      - "Frontend stack is plain TypeScript modules mounted by Stimulus, jsbundling-rails with esbuild, existing Tailwind, IndexedDB, optional idb helper, and a custom service worker."
      - "Do not use React, Svelte, Vue, Redux, a client-side router, a UI component framework, Dexie, Workbox, or a full SPA rewrite for V1."
      - "Offline V1 includes create, edit, and void for cached expenses with conflict detection."
      - "Offline support must also work in a normal browser tab after prior online use."
      - "Testing must continue documentation/testing.md and documentation/delivery_standards.md."
      - "Migration of existing user data is not required for Goal 2."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/expense-frontend-offline-pwa"

active_task: null

