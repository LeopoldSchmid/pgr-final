version: 2

goal:
  title: "Expense Goal 1: Domain, Ledger, and Sync API"
  slug: "expense-domain-ledger-sync-api"
  kind: existing_plan
  tranche: "Implement the Goal 1 backend foundation end to end, from repo validation through verified domain, ledger, sync API, late-joiner, audit, and test coverage."
  status: done
  oracle:
    signal: "The backend can represent and validate the new trip-person expense system, compute correct balances and settlements, handle late joiners, accept idempotent offline mutations, detect edit/void conflicts, and prove those behaviors through Rails tests."
    cadence: "after each Worker package and at final audit"
    final_proof: "Task receipts plus passing targeted Rails tests map to every backend acceptance criterion in documentation/expense_goal_1_domain_ledger_sync_api_2026-06-10.md."
  intake:
    original_request: "$goalbuddy documentation/expense_goal_1_domain_ledger_sync_api_2026-06-10.md"
    interpreted_outcome: "Prepare and execute a GoalBuddy board for the Goal 1 backend expense system implementation plan."
    input_shape: existing_plan
    audience: "PlanGoReminisce implementation team and later Goal 2 frontend/offline work"
    authority: requested
    proof_type: test
    completion_proof: "Rails model/service/request tests pass for the new backend domain, sync semantics, late-joiner behavior, settlement math, and authorization boundaries; final audit maps receipts to the Goal 1 handoff document."
    likely_misfire: "Superficial CRUD or partial model work that preserves old user-bound expense assumptions and misses idempotent sync, stale revision conflicts, audit events, settlement correctness, or API contracts for Goal 2."
    blind_spots_considered:
      - "Existing app routes, auth, and current trip conventions must be discovered before writes."
      - "The worktree is already dirty; unrelated user changes must not be reverted."
      - "Goal 2 needs stable same-origin JSON API contracts."
      - "Old production expense data is test-only, so reset/export is acceptable."
      - "Money and sync behavior need stronger proof than normal CRUD."
    existing_plan_facts:
      - "Use TripPerson, Expense, ExpenseSplit, SplitGroup, ExpenseEvent, and ClientMutation unless a Rails naming conflict forces a small adjustment."
      - "Expenses and splits reference trip people, not directly registered users."
      - "TripPerson supports active, invited, placeholder, and archived states, plus optional linked user and email."
      - "Expense supports draft, active, needs_split, and voided statuses."
      - "Draft and needs_split expenses are excluded from settlement suggestions until completed."
      - "Supported split methods are equal, exact amounts, shares/weights, and percentages."
      - "Settlement suggestions minimize transfers while preserving correct net balances."
      - "Client mutations must be idempotent for offline create, edit, and void."
      - "Edit and void mutations include base server revision and must surface conflicts instead of silently overwriting."
      - "Late-joiner flows include pending person, link on join, merge duplicates, and retroactive include preview/apply."
      - "Expose same-origin Rails JSON APIs for Goal 2 snapshot, trip people, groups, expenses, sync, conflicts, and retroactive include."
      - "Continue Rails test approach; no Selenium."
      - "No careful production migration is required; old expense data may be backed up/exported then reset."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

